<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Project Gabut - Pacman</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <h1>🟡 Project Gabut: Pac-Man</h1>
    <div class="hud">
      <div>Skor: <span id="score">0</span></div>
      <div>Nyawa: <span id="lives">3</span></div>
      <div id="status"></div>
    </div>
    <canvas id="game" width="560" height="620"></canvas>
    <p class="hint">Kontrol: Panah / WASD &nbsp;|&nbsp; Tekan <b>R</b> untuk restart</p>
  </div>
  <script src="game.js"></script>
</body>
</html>
